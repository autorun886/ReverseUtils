[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-export-cli"
version = "0.5.0"
description = "Headless IDA export CLI built on idalib and ida-domain"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ida", "idalib", "reverse-engineering", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = [
  "ida-domain>=0.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.scripts]
ida-export-cli = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "api",
  "cli",
  "config",
  "exporter",
  "ida_adapter",
  "launcher",
  "layout",
  "version",
  "worker",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: runs the real IDA 9.x idalib backend"]
